# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on Render pick
# "New +" -> "Blueprint" and point it at this repo. Render reads this file,
# provisions the service and its database, and prompts you for
# ANTHROPIC_API_KEY (kept out of the repo since it's a secret). No Docker
# needed for this path — Render builds and runs the Node app directly
# from server/.
services:
  - type: web
    name: bayou-blazer-server
    runtime: node
    # This MUST match what is actually running, because the dashboard shows
    # this service as Blueprint managed, and Render overwrites a dashboard
    # change that conflicts with this file on the next Blueprint sync. It
    # said "free" while the service was upgraded to starter, so a sync would
    # have quietly downgraded it and brought back the 30-60s cold start that
    # upgrade was bought to remove.
    # starter: 0.5 CPU / 512 MB, ~$7/mo, stays warm.
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: CORS_ORIGIN
        value: "*"
      # The daily spend ceiling. Unset means no limit, which is right for
      # local development and wrong for a link anyone can open: without
      # this the guard ships switched off. Raise it once real usage has a
      # shape; $15/day covers roughly forty plans at the measured cost.
      - key: DAILY_LIMIT_USD
        value: "15"
      # Wired automatically from the database declared below — sessions,
      # saved plans (claim codes), and analytics then survive restarts,
      # redeploys, and running more than one instance. Remove this block
      # and the app falls back to in-memory + file storage on its own.
      - key: DATABASE_URL
        fromDatabase:
          name: bayou-blazer-db
          property: connectionString

databases:
  - name: bayou-blazer-db
    databaseName: bayoublazer
    user: bayoublazer
    # No `plan` here on purpose, and it must not say "free".
    #
    # This database is on a PAID instance type (the dashboard shows it as
    # 0.5c-1g, and the billing page accrues real datastore charges; a free
    # database accrues nothing). It therefore does not expire, and it is not
    # on the 30-day free-tier clock.
    #
    # The field is omitted rather than guessed because Render retains an
    # existing database's instance type when the Blueprint is synced, so
    # leaving it out is the option that cannot fight the dashboard. Naming
    # the wrong instance type here could. Set the instance type on the
    # database's own page in Render.
    #
    # Do not restore `plan: free`. This holds every claim code a customer
    # saves, and free databases are deleted after their trial window.
