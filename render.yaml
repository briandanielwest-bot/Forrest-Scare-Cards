# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on Render pick
# "New +" -> "Blueprint" and point it at this repo. Render reads this file,
# provisions the service and its database, and prompts you for
# ANTHROPIC_API_KEY (kept out of the repo since it's a secret). No Docker
# needed for this path — Render builds and runs the Node app directly
# from server/.
services:
  - type: web
    name: bayou-blazer-server
    runtime: node
    # "free" spins down when idle, so the first visitor after a quiet
    # stretch waits ~30-60s for a cold start. "starter" (~$7/mo) keeps it
    # warm — worth it the day real people start using this.
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: CORS_ORIGIN
        value: "*"
      # Wired automatically from the database declared below — sessions,
      # saved plans (claim codes), and analytics then survive restarts,
      # redeploys, and running more than one instance. Remove this block
      # and the app falls back to in-memory + file storage on its own.
      - key: DATABASE_URL
        fromDatabase:
          name: bayou-blazer-db
          property: connectionString

databases:
  - name: bayou-blazer-db
    databaseName: bayoublazer
    user: bayoublazer
    # Render's free Postgres is deleted after its trial window — fine for
    # kicking the tires, but move to a paid plan (basic-256mb, roughly
    # $6/mo at the time of writing) before real users depend on it.
    # Check the current price on the plan selector when you create it.
    plan: free
