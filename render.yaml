# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then on Render pick
# "New +" -> "Blueprint" and point it at this repo. Render reads this file,
# provisions the service, and prompts you for ANTHROPIC_API_KEY (kept out of
# the repo since it's a secret). No Docker needed for this path — Render
# builds and runs the Node app directly from server/.
services:
  - type: web
    name: bayou-blazer-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: CORS_ORIGIN
        value: "*"
