# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render pick "New +" → "Blueprint"
# and point it at the repo. Render reads this file, provisions the service and
# its database, wires DATABASE_URL automatically, and prompts for the secrets
# marked `sync: false` (which are deliberately not in the repo).
#
# The web half of the product does NOT live here — it is a Next.js app in
# web/, deployed on Vercel. See ../README.md.
services:
  - type: web
    name: storykeep-api
    runtime: node
    # `starter` and not `free`, on purpose. The free plan sleeps after 15
    # minutes, and a 50-second cold start lands on someone who has just
    # pressed the microphone to talk about their late husband. That is the
    # single worst moment in this product to make somebody wait.
    plan: starter
    rootDir: storykeep/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      # Signs the session cookie. Render generates one and holds it steady
      # across deploys — without this every deploy signs every author out.
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_FAST_MODEL
        value: claude-sonnet-5
      # Must name the Vercel origin exactly. The session cookie is cross-site,
      # and a browser rejects a credentialed request against `*`.
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      # The ceilings. Unset means no limit, which is right on a laptop and
      # wrong on a link anyone can open. Measured cost is roughly $0.30-$0.70
      # of API spend per finished memoir chapter.
      - key: DAILY_LIMIT_USD
        value: "25"
      - key: USER_MONTHLY_LIMIT_USD
        value: "12"
      # Optional. Without it, voice still works using the browser's own
      # speech recognition — less accurate, and absent in Firefox.
      - key: DEEPGRAM_API_KEY
        sync: false
      # Optional. Without it, every spread still gets a full art brief; only
      # the rendering is skipped.
      - key: REPLICATE_API_TOKEN
        sync: false
      # Optional. Without these, exports are free and no payment is taken.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: storykeep-db
          property: connectionString

databases:
  - name: storykeep-db
    databaseName: storykeep
    user: storykeep
    # No `plan` key here, on purpose.
    #
    # This database holds the only recording of things people said about their
    # dead parents. A free Render database is deleted at the end of its trial
    # window. Set the instance type on the database's own page in Render, and
    # never write `plan: free` here — a Blueprint sync would enforce it.
